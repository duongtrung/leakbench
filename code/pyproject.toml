[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakbench"
version = "0.1.0"
description = "A reproducible benchmark for task leakage from LLM agent tool-call metadata."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LeakBench re-implementation" }]
keywords = [
  "measurement", "llm-agents", "metadata-privacy", "traffic-analysis",
  "quantitative-information-flow", "reproducible-benchmark",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1", "mypy>=1.5"]

[project.scripts]
leakbench = "leakbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakbench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
# No python_version pin: mypy then type-checks against the interpreter actually in
# use. Pinning 3.11 makes mypy reject its own bundled stubs for dependencies that ship
# 3.12+ syntax (e.g. numpy's `type` statements) when run on a newer interpreter.
ignore_missing_imports = true
warn_unused_ignores = false
